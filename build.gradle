plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

loom {
}

repositories {
	mavenCentral()
}

// WebRTC video streaming for Hybrid displays (webrtc-java). The Java API is jar-in-jar'd; the native
// library is copied into the mod jar root where webrtc-java's NativeLoader finds it.
// Each native is ~20 MB, so only Windows is bundled by default. Override with
// -Pwebrtc_natives=windows-x86_64,linux-x86_64,macos-aarch64,macos-x86_64
def webrtcVersion = "0.19.0"
def webrtcNativeList = (project.findProperty("webrtc_natives") ?: "windows-x86_64").split(",").collect { it.trim() }.findAll { !it.isEmpty() }
configurations {
	webrtcNatives
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
	include "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}"
	webrtcNativeList.each { webrtcNatives "dev.onvoid.webrtc:webrtc-java:${webrtcVersion}:${it}" }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	from({ configurations.webrtcNatives.collect { zipTree(it) } }) {
		include "*.dll", "*.so", "*.dylib"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
